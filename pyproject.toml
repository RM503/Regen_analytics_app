[project]
name = "regenorganics-analytics-app"
version = "1.1.0"
description = "App designed for Regen Organics to generate analytics on farmlands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core web app/runtime
    "dash>=3.1.1",
    "dash-bootstrap-components>=2.0.3",
    "dash-leaflet>=1.1.3",
    "flask-caching>=2.3.1",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.6",

    # Config / validation / dates
    "dotenv>=0.9.9",
    "pydantic[email]>=2.11.7",
    "python-dateutil>=2.9.0.post0",

    # Core data
    "pandas>=2.3.0",
    "pandera>=0.24.0",
    "pyarrow>=21.0.0",

    # Database / auth
    "geoalchemy2>=0.17.1",
    "psycopg2-binary>=2.9.10",
    "sqlmodel>=0.0.24",
    "supabase>=2.17.0"
]

[project.optional-dependencies]

worker = [
    "celery>=5.6.2",
    "redis>=7.1.0",
]

geo = [
    "earthengine-api>=1.5.22",
    "geemap>=0.35.3",
    "geopandas>=1.1.1",
]

analytics = [
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
]

notebook = [
    "ipykernel>=6.30.1",
    "ipython>=9.4.0",
    "ipywidgets>=8.1.7",
]

cloud = [
    "aiohttp>=3.12.14",
    "boto3>=1.40.33",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402", "PLR0913"]
select = [
    "F",   # Pyflakes
    "W",   # pycodestyle
    "E",   # pycodestyle
    "UP",  # pyupgrade
    "PL",  # Pylint
    "T201", # Print Statement
]
