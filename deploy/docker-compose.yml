x-runtime: &runtime
  APP_ENV: eb
  AWS_REGION: us-east-1
  AWS_SECRETS_NAME: regen_organics_analytics_app/env
  GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  WEB_CONCURRENCY: "2"
  GUNICORN_THREADS: "2"
  LOG_TO_FILE: "0"

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  app:
    build: .
    environment: *runtime
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5
    restart: unless-stopped
  celery:
    build: .
    command: celery -A regen_queue.celery_app worker --loglevel=info --concurrency=2
    environment: *runtime
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
